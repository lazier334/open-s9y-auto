<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>S9Y Terminal</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css" />
  <style>
    :root {
      --green: #22c55e;
      --blue: #3b82f6;
      --purple: #a855f7;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #1e1e1e; height: 100vh; display: flex; flex-direction: column; color: #d4d4d4; }

    .header { background: #252526; border-bottom: 1px solid #3e3e42; padding: 8px 16px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .header input, .header select { padding: 5px 8px; border: 1px solid #3e3e42; border-radius: 4px; font-size: 13px; background: #3c3c3c; color: #d4d4d4; }
    .header input[type="text"] { min-width: 160px; }
    .header button { padding: 5px 14px; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; }
    .btn-primary { background: #0e639c; color: #fff; }
    .btn-primary:hover { background: #1177bb; }
    .btn-danger { background: #a1260d; color: #fff; }
    .btn-danger:hover { background: #c32b16; }
    .status { font-size: 12px; padding: 3px 10px; border-radius: 10px; }
    .status.online { background: #1a3a1a; color: #4ec94e; }
    .status.offline { background: #3a1a1a; color: #f44747; }

    .main { flex: 1; display: flex; overflow: hidden; }

    .sidebar { width: 240px; background: #252526; border-right: 1px solid #3e3e42; display: flex; flex-direction: column; }
    .sidebar-top { padding: 10px; border-bottom: 1px solid #3e3e42; font-size: 13px; color: #999; }
    .pivot-list { flex: 1; overflow-y: auto; padding: 6px; }
    .pivot-item { padding: 8px 10px; border-radius: 6px; cursor: pointer; display: flex; align-items: center; gap: 8px; font-size: 13px; margin-bottom: 2px; }
    .pivot-item:hover { background: #2a2d2e; }
    .pivot-item.active { background: #094771; }
    .pivot-avatar { width: 28px; height: 28px; border-radius: 50%; background: #0e639c; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; flex-shrink: 0; }
    .pivot-info { flex: 1; min-width: 0; }
    .pivot-name { font-weight: 500; display: flex; align-items: center; gap: 6px; }
    .pivot-adapter { font-size: 10px; padding: 1px 5px; border-radius: 3px; background: #3c3c3c; color: #888; font-weight: 400; flex-shrink: 0; }
    .badge-ws {background: var(--purple);color: #fff;}
    .badge-http {background: var(--blue);color: #fff;}
    .badge-fun {background: var(--green);color: #000;}
    .pivot-id { font-size: 11px; color: #888; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .refresh-btn { margin: 6px 10px; padding: 5px; border: 1px solid #3e3e42; border-radius: 4px; background: #2d2d2d; cursor: pointer; font-size: 12px; color: #ccc; }
    .refresh-btn:hover { background: #3c3c3c; }

    .terminal-area { flex: 1; display: flex; flex-direction: column; background: #1e1e1e; }
    .tab-bar { display: flex; background: #252526; border-bottom: 1px solid #3e3e42; padding: 0 8px; align-items: center; min-height: 35px; }
    .tab { padding: 6px 14px; border-right: 1px solid #3e3e42; cursor: pointer; font-size: 13px; display: flex; align-items: center; gap: 8px; color: #999; }
    .tab:hover { background: #2a2d2e; }
    .tab.active { background: #1e1e1e; color: #fff; border-bottom: 2px solid #0e639c; margin-bottom: -1px; }
    .tab-close { font-size: 14px; color: #666; cursor: pointer; padding: 0 3px; border-radius: 3px; }
    .tab-close:hover { color: #fff; background: #a1260d; }
    .tab-add { padding: 4px 10px; cursor: pointer; font-size: 16px; color: #999; border: none; background: transparent; border-radius: 4px; }
    .tab-add:hover { background: #2a2d2e; color: #fff; }
    .tab-add:disabled { color: #555; cursor: not-allowed; }
    .terminal-container { flex: 1; overflow: hidden; padding: 4px; }
    .terminal-placeholder { display: flex; align-items: center; justify-content: center; height: 100%; color: #666; font-size: 14px; }
  </style>
</head>
<body>
  <div class="header">
    <input id="gatewayUrl" type="text" placeholder="网关地址" value="ws://localhost:3000">
    <input id="username" type="text" placeholder="用户名" value="">
    <button id="connectBtn" class="btn-primary">连接</button>
    <button id="disconnectBtn" class="btn-danger" style="display:none">断开</button>
    <span id="status" class="status offline">未连接</span>
    <span style="margin-left:auto;font-size:12px;color:#888;" id="hint">选择一个终端支点开始</span>
  </div>

  <div class="main">
    <div class="sidebar">
      <div class="sidebar-top">终端支点列表</div>
      <button class="refresh-btn" id="refreshBtn">刷新列表</button>
      <div class="pivot-list" id="pivotList"></div>
    </div>

    <div class="terminal-area">
      <div class="tab-bar" id="tabBar">
        <button class="tab-add" id="tabAddBtn" disabled title="新建终端">+</button>
      </div>
      <div class="terminal-container" id="terminalContainer">
        <div class="terminal-placeholder" id="placeholder">
          连接网关后，点击左侧支点创建终端会话
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"></script>
  <script>
    // === state ===
    const STORAGE_KEY = 's9y_term_config';
    let ws = null;
    let connected = false;
    let myPivotId = '';
    let heartbeatTimer = null;
    let allPivots = [];
    let tabs = new Map();       // sessionId -> { sessionId, pivotId, term, fitAddon, container }
    let activeTabId = null;
    let selectedPivotId = null;
    let resizeThrottle = new Map(); // sessionId -> timer

    function genId() { return crypto.randomUUID(); }
    function now() { return Date.now(); }

    // === config ===
    function loadConfig() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) return JSON.parse(raw);
      } catch {}
      return {};
    }
    function saveConfig(cfg) {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify({ ...loadConfig(), ...cfg })); } catch {}
    }

    // === DOM refs ===
    const $ = (id) => document.getElementById(id);
    const gatewayUrlInput = $('gatewayUrl');
    const usernameInput = $('username');
    const connectBtn = $('connectBtn');
    const disconnectBtn = $('disconnectBtn');
    const statusEl = $('status');
    const pivotListEl = $('pivotList');
    const refreshBtn = $('refreshBtn');
    const tabBar = $('tabBar');
    const tabAddBtn = $('tabAddBtn');
    const terminalContainer = $('terminalContainer');
    const placeholder = $('placeholder');
    const hintEl = $('hint');

    // === init config ===
    const saved = loadConfig();
    if (saved.gatewayUrl) gatewayUrlInput.value = saved.gatewayUrl;
    if (saved.username) usernameInput.value = saved.username;

    function setStatus(online, text) {
      statusEl.textContent = text;
      statusEl.className = 'status ' + (online ? 'online' : 'offline');
    }

    function updateUI() {
      connectBtn.style.display = connected ? 'none' : '';
      disconnectBtn.style.display = connected ? '' : 'none';
      gatewayUrlInput.disabled = connected;
      usernameInput.disabled = connected;
    }

    // === connection ===
    function connect() {
      saveConfig({ gatewayUrl: gatewayUrlInput.value, username: usernameInput.value });

      const url = gatewayUrlInput.value;
      const wsUrl = url.replace(/^http/, 'ws');
      myPivotId = usernameInput.value.trim() || 'term-user-' + Math.random().toString(36).slice(2, 8);

      ws = new WebSocket(wsUrl);

      ws.onopen = () => {
        connected = true;
        updateUI();
        setStatus(true, '已连接 (' + myPivotId + ')');

        // register
        ws.send(JSON.stringify({
          senderId: myPivotId,
          type: 'register',
          payload: { pivotId: myPivotId, type: 'user', name: myPivotId, capabilities: ['terminal-client'] },
          traceId: genId(),
          timestamp: now(),
        }));

        // heartbeat
        heartbeatTimer = setInterval(() => {
          if (ws.readyState === 1) {
            ws.send(JSON.stringify({ senderId: myPivotId, type: 'heartbeat', payload: {}, traceId: genId(), timestamp: now() }));
          }
        }, 30000);

        fetchPivots();
      };

      ws.onmessage = (e) => {
        try {
          const msg = JSON.parse(e.data);
          const pdata = msg.payload?.data;

          // match reply by traceId (terminal:create response, etc.)
          // handled generically — we don't use pending requests for now

          // terminal output
          if (pdata?.type === 'terminal:output') {
            const tab = tabs.get(pdata.sessionId);
            if (tab) tab.term.write(pdata.data ?? '');
            return;
          }
          if (pdata?.type === 'terminal:created') {
            hintEl.textContent = '会话已创建: ' + pdata.sessionId;
            return;
          }
          if (pdata?.type === 'terminal:closed') {
            const tab = tabs.get(pdata.sessionId);
            if (tab) {
              tab.term.write('\r\n\x1b[33m[Session closed' + (pdata.error ? ': ' + pdata.error : '') + ']\x1b[0m\r\n');
              setTimeout(() => closeTab(pdata.sessionId), 3000);
            }
            return;
          }
          if (pdata?.type === 'terminal:error') {
            const tab = tabs.get(pdata.sessionId);
            if (tab) tab.term.write('\r\n\x1b[31m[Error: ' + (pdata.error || 'unknown') + ']\x1b[0m\r\n');
            return;
          }

          // pivots query response (from gateway)
          if (pdata?.pivots || Array.isArray(pdata)) {
            const list = pdata.pivots || pdata;
            if (Array.isArray(list)) {
              allPivots = list.filter(p => p.pivotId !== myPivotId);
              renderPivotList();
            }
            return;
          }
        } catch {}
      };

      ws.onclose = () => { cleanup(); setStatus(false, '已断开'); updateUI(); };
      ws.onerror = () => { cleanup(); setStatus(false, '连接错误'); updateUI(); };
    }

    function disconnect() {
      if (ws) { ws.close(); ws = null; }
      cleanup();
      setStatus(false, '未连接');
      updateUI();
    }

    function cleanup() {
      connected = false;
      if (heartbeatTimer) { clearInterval(heartbeatTimer); heartbeatTimer = null; }
      // close all terminal tabs
      for (const [id] of tabs) {
        const tab = tabs.get(id);
        try { tab.term.dispose(); } catch {}
        if (tab.container.parentNode) tab.container.remove();
      }
      tabs.clear();
      activeTabId = null;
      selectedPivotId = null;
      tabAddBtn.disabled = true;
      placeholder.style.display = '';
      hintEl.textContent = '选择一个终端支点开始';
      renderTabBar();
    }

    // === pivot list ===
    function fetchPivots() {
      if (!ws || ws.readyState !== 1) return;
      ws.send(JSON.stringify({
        senderId: myPivotId,
        type: 'pivots',
        payload: {},
        traceId: genId(),
        timestamp: now(),
      }));
    }

    function renderPivotList() {
      const terminals = allPivots.filter(p => {
        const caps = p.capabilities || [];
        return caps.includes('terminal') || caps.includes('pty');
      });

      pivotListEl.innerHTML = terminals.map(p => {
        const name = p.name || p.pivotId;
        const initial = (name[0] || 'T').toUpperCase();
        const activeClass = selectedPivotId === p.pivotId ? ' active' : '';
        return `<div class="pivot-item${activeClass}" data-pivot-id="${p.pivotId}">
          <div class="pivot-avatar">${initial}</div>
          <div class="pivot-info">
            <div class="pivot-name">${p.adapterType ? `<span class="pivot-adapter badge-${p.adapterType ?? 'def'}">${escHtml(p.adapterType)}</span>` : ''}${escHtml(name)}</div>
            <div class="pivot-id">${escHtml(p.pivotId)}</div>
          </div>
        </div>`;
      }).join('');

      // click handlers
      pivotListEl.querySelectorAll('.pivot-item').forEach(el => {
        el.addEventListener('click', () => {
          selectedPivotId = el.dataset.pivotId;
          renderPivotList();
          tabAddBtn.disabled = false;
          hintEl.textContent = '已选择: ' + selectedPivotId + '，点击 + 创建终端';
        });
      });
    }

    function escHtml(s) {
      return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    // === tab management ===
    function renderTabBar() {
      const existing = tabBar.querySelectorAll('.tab');
      existing.forEach(el => el.remove());

      for (const [id, tab] of tabs) {
        const div = document.createElement('div');
        div.className = 'tab' + (id === activeTabId ? ' active' : '');
        div.innerHTML = `<span class="tab-label">${escHtml(id)}</span><span class="tab-close">&times;</span>`;
        div.querySelector('.tab-label').addEventListener('click', () => switchTab(id));
        div.querySelector('.tab-close').addEventListener('click', (e) => { e.stopPropagation(); closeTab(id); });
        tabBar.insertBefore(div, tabAddBtn);
      }
    }

    function createTab() {
      if (!selectedPivotId || !connected) return;

      const sessionId = 'term-' + Math.random().toString(36).slice(2, 8);
      const container = document.createElement('div');
      container.className = 'terminal-container';
      container.style.display = 'none';
      terminalContainer.appendChild(container);

      const term = new Terminal({
        cursorBlink: true,
        fontSize: 14,
        fontFamily: "'Cascadia Code', 'Fira Code', 'Consolas', 'Courier New', monospace",
        theme: { background: '#1e1e1e', foreground: '#d4d4d4', cursor: '#d4d4d4' },
        allowProposedApi: true,
      });
      const fitAddon = new FitAddon.FitAddon();
      term.loadAddon(fitAddon);
      term.open(container);
      fitAddon.fit();

      // input: xterm -> WS -> pivot
      term.onData((data) => {
        if (!ws || ws.readyState !== 1) return;
        ws.send(JSON.stringify({
          senderId: myPivotId,
          targetId: selectedPivotId,
          type: 'push',
          payload: { data: { type: 'terminal:input', sessionId, data } },
          traceId: genId(),
          timestamp: now(),
        }));
      });

      // resize: xterm -> WS -> pivot (throttled 200ms)
      term.onResize(({ cols, rows }) => {
        const existing = resizeThrottle.get(sessionId);
        if (existing) clearTimeout(existing);
        resizeThrottle.set(sessionId, setTimeout(() => {
          resizeThrottle.delete(sessionId);
          if (!ws || ws.readyState !== 1) return;
          ws.send(JSON.stringify({
            senderId: myPivotId,
            targetId: selectedPivotId,
            type: 'push',
            payload: { data: { type: 'terminal:resize', sessionId, cols, rows } },
            traceId: genId(),
            timestamp: now(),
          }));
        }, 200));
      });

      tabs.set(sessionId, { sessionId, pivotId: selectedPivotId, term, fitAddon, container });
      switchTab(sessionId);
      renderTabBar();

      // create PTY on pivot
      ws.send(JSON.stringify({
        senderId: myPivotId,
        targetId: selectedPivotId,
        type: 'push',
        payload: { data: { type: 'terminal:create', sessionId, cols: term.cols, rows: term.rows } },
        traceId: genId(),
        timestamp: now(),
      }));

      placeholder.style.display = 'none';
      hintEl.textContent = '终端会话: ' + sessionId;
    }

    function switchTab(sessionId) {
      for (const [id, tab] of tabs) {
        tab.container.style.display = id === sessionId ? '' : 'none';
      }
      activeTabId = sessionId;
      const tab = tabs.get(sessionId);
      if (tab) {
        tab.fitAddon.fit();
        tab.term.focus();
      }
      renderTabBar();
    }

    function closeTab(sessionId) {
      const tab = tabs.get(sessionId);
      if (!tab) return;

      // tell pivot
      if (ws && ws.readyState === 1) {
        ws.send(JSON.stringify({
          senderId: myPivotId,
          targetId: tab.pivotId,
          type: 'push',
          payload: { data: { type: 'terminal:close', sessionId } },
          traceId: genId(),
          timestamp: now(),
        }));
      }

      tab.term.dispose();
      if (tab.container.parentNode) tab.container.remove();
      tabs.delete(sessionId);

      const remaining = Array.from(tabs.keys());
      if (remaining.length > 0) {
        switchTab(remaining[remaining.length - 1]);
      } else {
        activeTabId = null;
        placeholder.style.display = '';
        hintEl.textContent = '选择一个终端支点开始';
      }
      renderTabBar();
    }

    // === event bindings ===
    connectBtn.addEventListener('click', connect);
    disconnectBtn.addEventListener('click', disconnect);
    refreshBtn.addEventListener('click', fetchPivots);
    tabAddBtn.addEventListener('click', createTab);

    // keyboard shortcut: Ctrl+Shift+T to add tab
    document.addEventListener('keydown', (e) => {
      if (e.ctrlKey && e.shiftKey && e.key === 'T') {
        e.preventDefault();
        createTab();
      }
    });

    // resize observer for terminal containers
    const ro = new ResizeObserver(() => {
      const tab = tabs.get(activeTabId);
      if (tab) tab.fitAddon.fit();
    });
    ro.observe(terminalContainer);
  </script>
</body>
</html>
