<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>S9Y 网关 - 登录</title>
  <style>
    :root {
      --bg: #0f1117;
      --card: #1a1d27;
      --border: #2a2d3a;
      --text: #e1e4ed;
      --muted: #8b8fa3;
      --green: #22c55e;
      --yellow: #eab308;
      --red: #ef4444;
      --blue: #3b82f6;
      --purple: #a855f7;
      --orange: #f97316;
      --cyan: #06b6d4;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* ── 背景动画粒子 ── */
    .bg-particles {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }
    .bg-particles .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.12;
      animation: orbFloat 12s ease-in-out infinite;
    }
    .bg-particles .orb:nth-child(1) {
      width: 400px; height: 400px;
      background: var(--blue);
      top: -10%; left: -5%;
      animation-delay: 0s;
    }
    .bg-particles .orb:nth-child(2) {
      width: 300px; height: 300px;
      background: var(--purple);
      bottom: -10%; right: -5%;
      animation-delay: -4s;
    }
    .bg-particles .orb:nth-child(3) {
      width: 250px; height: 250px;
      background: var(--cyan);
      top: 60%; left: 60%;
      animation-delay: -8s;
    }

    @keyframes orbFloat {
      0%, 100% { transform: translate(0, 0) scale(1); }
      25% { transform: translate(60px, -40px) scale(1.15); }
      50% { transform: translate(-30px, 30px) scale(0.9); }
      75% { transform: translate(-50px, -20px) scale(1.1); }
    }

    /* ── 网格线背景 ── */
    .grid-bg {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background-image:
        linear-gradient(rgba(255,255,255,.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.02) 1px, transparent 1px);
      background-size: 60px 60px;
      animation: gridShift 20s linear infinite;
    }
    @keyframes gridShift {
      0% { background-position: 0 0, 0 0; }
      100% { background-position: 60px 60px, 60px 60px; }
    }

    /* ── 登录卡片 ── */
    .login-card {
      position: relative;
      z-index: 1;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 48px 40px 40px;
      width: 400px;
      max-width: 90vw;
      box-shadow: 0 24px 80px rgba(0,0,0,.5);
      animation: cardEnter .6s cubic-bezier(.16,1,.3,1) both;
    }

    @keyframes cardEnter {
      0% {
        opacity: 0;
        transform: translateY(24px) scale(.96);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* ── shake 抖动 ── */
    .login-card.shake {
      animation: cardShake .5s cubic-bezier(.36,.07,.19,.97) both;
    }
    @keyframes cardShake {
      0%, 100% { transform: translateX(0); }
      10% { transform: translateX(-8px); }
      30% { transform: translateX(8px); }
      50% { transform: translateX(-6px); }
      70% { transform: translateX(6px); }
      90% { transform: translateX(-3px); }
    }

    /* ── 顶部图标 ── */
    .login-icon {
      width: 56px;
      height: 56px;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--blue), var(--purple));
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      font-size: 24px;
      box-shadow: 0 8px 24px rgba(59,130,246,.25);
      animation: iconPulse 3s ease-in-out infinite;
    }
    @keyframes iconPulse {
      0%, 100% { box-shadow: 0 8px 24px rgba(59,130,246,.25); }
      50% { box-shadow: 0 8px 36px rgba(168,85,247,.35); }
    }

    .login-title {
      text-align: center;
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 6px;
      letter-spacing: -.3px;
    }
    .login-subtitle {
      text-align: center;
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 32px;
    }

    /* ── 输入框 ── */
    .field {
      margin-bottom: 18px;
    }
    .field label {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: .5px;
      font-weight: 500;
    }
    .field input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 15px;
      font-family: inherit;
      transition: border-color .2s, box-shadow .2s;
      outline: none;
    }
    .field input:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(59,130,246,.15);
    }
    .field input.error-input {
      border-color: var(--red);
      box-shadow: 0 0 0 3px rgba(239,68,68,.15);
    }

    /* ── 错误提示 ── */
    .error-msg {
      font-size: 13px;
      color: var(--red);
      text-align: center;
      min-height: 20px;
      margin-bottom: 8px;
      opacity: 0;
      transform: translateY(-6px);
      transition: opacity .25s, transform .25s;
    }
    .error-msg.show {
      opacity: 1;
      transform: translateY(0);
    }

    /* ── 登录按钮 ── */
    .login-btn {
      width: 100%;
      padding: 13px;
      border-radius: 8px;
      border: none;
      background: linear-gradient(135deg, var(--blue), #6366f1);
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity .2s, transform .1s, box-shadow .2s;
      position: relative;
      overflow: hidden;
    }
    .login-btn:hover {
      opacity: .9;
      box-shadow: 0 4px 20px rgba(59,130,246,.3);
    }
    .login-btn:active {
      transform: scale(.98);
    }
    .login-btn.loading {
      pointer-events: none;
      opacity: .7;
    }
    .login-btn.loading::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.1), transparent);
      animation: btnShimmer 1.2s ease-in-out infinite;
    }
    @keyframes btnShimmer {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }

    /* ── 成功过渡 ── */
    .success-overlay {
      position: fixed;
      inset: 0;
      background: var(--bg);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity .4s;
    }
    .success-overlay.show {
      opacity: 1;
      pointer-events: auto;
    }
    .success-check {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: var(--green);
      display: flex;
      align-items: center;
      justify-content: center;
      animation: checkPop .5s cubic-bezier(.16,1,.3,1) both;
    }
    @keyframes checkPop {
      0% { transform: scale(0); }
      100% { transform: scale(1); }
    }
    .success-check svg {
      width: 40px;
      height: 40px;
      stroke: #fff;
      stroke-width: 3;
      fill: none;
      stroke-dasharray: 60;
      stroke-dashoffset: 60;
      animation: checkDraw .4s .35s forwards;
    }
    @keyframes checkDraw {
      to { stroke-dashoffset: 0; }
    }
  </style>
</head>

<body>

  <!-- 背景动画 -->
  <div class="bg-particles">
    <div class="orb"></div>
    <div class="orb"></div>
    <div class="orb"></div>
  </div>
  <div class="grid-bg"></div>

  <!-- 成功遮罩 -->
  <div class="success-overlay" id="success-overlay">
    <div class="success-check">
      <svg viewBox="0 0 24 24"><polyline points="5 13 10 18 19 6"/></svg>
    </div>
  </div>

  <!-- 登录卡片 -->
  <div class="login-card" id="login-card">
    <div class="login-icon">&#9881;</div>
    <div class="login-title">S9Y 网关</div>
    <div class="login-subtitle">请输入凭据以继续访问管理面板</div>

    <div class="error-msg" id="error-msg"></div>

    <form id="login-form" autocomplete="off">
      <div class="field">
        <label for="username">账号</label>
        <input id="username" type="text" placeholder="输入账号" autofocus>
      </div>
      <div class="field">
        <label for="password">密码</label>
        <input id="password" type="password" placeholder="输入密码">
      </div>
      <button type="submit" class="login-btn" id="login-btn">登 录</button>
    </form>
  </div>

  <script>
    // 如果已有有效 cookie，自动跳转到管理面板
    async function init() {
      try {
        const res = await fetch('/api/status');
        if (res.ok) {
          window.location.replace('/index.html');
        }
      } catch (_) {
        // 未登录或网络不通，停留在登录页
      }
    }
    init();

    const form = document.getElementById('login-form');
    const usernameEl = document.getElementById('username');
    const passwordEl = document.getElementById('password');
    const errorMsg = document.getElementById('error-msg');
    const loginBtn = document.getElementById('login-btn');
    const card = document.getElementById('login-card');
    const overlay = document.getElementById('success-overlay');

    function showError(msg) {
      errorMsg.textContent = msg;
      errorMsg.classList.add('show');
      card.classList.add('shake');
      usernameEl.classList.add('error-input');
      passwordEl.classList.add('error-input');
      setTimeout(() => {
        card.classList.remove('shake');
        usernameEl.classList.remove('error-input');
        passwordEl.classList.remove('error-input');
      }, 500);
    }

    function clearError() {
      errorMsg.classList.remove('show');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      clearError();

      const username = usernameEl.value.trim();
      const password = passwordEl.value.trim();

      if (!username || !password) {
        showError('账号和密码不能为空');
        return;
      }

      loginBtn.classList.add('loading');
      loginBtn.textContent = '登录中...';

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password }),
        });

        if (res.ok) {
          overlay.classList.add('show');
          setTimeout(() => {
            window.location.href = '/index.html';
          }, 800);
        } else {
          const data = await res.json();
          showError(data.error || '登录失败');
        }
      } catch (err) {
        showError('网络错误，请稍后重试');
      } finally {
        loginBtn.classList.remove('loading');
        loginBtn.textContent = '登 录';
      }
    });
  </script>
</body>

</html>
